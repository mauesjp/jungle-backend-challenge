services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_dev_password
      POSTGRES_DB: jungle_wagering
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U jungle -d jungle_wagering
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:4.6
    container_name: jungle-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: '0'
    ports:
      - '127.0.0.1:4566:4566'

  localstack-init:
    image: localstack/localstack:4.6
    container_name: jungle-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    entrypoint: ['/bin/bash']
    command:
      - /scripts/01-create-queues.sh
    volumes:
      - ./localstack-init:/scripts:ro
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    restart: 'no'

  setup:
    image: alpine:3.20
    command: ['echo', 'Jungle Gaming infrastructure ready']
    depends_on:
      postgres:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    restart: 'no'

volumes:
  postgres_data:
